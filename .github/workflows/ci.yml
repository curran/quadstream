name: CI
on:
  pull_request:
  push:
    branches: [master, main]
jobs:
  test:
    # Playwright 1.55.1 supports Ubuntu 24.04; avoid runner-image drift.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: node examples/hello.mjs
      - run: node bin/quadstream.mjs --help
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:globe:browser
