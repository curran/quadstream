<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quadstream Globe</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #eee;
        font:
          14px system-ui,
          sans-serif;
        background: #141432;
      }
      #globe {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: grab;
        background: radial-gradient(
          ellipse at 30% 20%,
          #1b1b3a,
          #141432 40%,
          #0b0b1e
        );
      }
      #globe:focus-visible {
        outline: 2px solid #c4b5fd;
        outline-offset: -3px;
      }
      [hidden] {
        display: none !important;
      }
      #controls {
        position: absolute;
        top: 12px;
        left: 12px;
        max-width: calc(100% - 24px);
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #toolbar button {
        min-height: 36px;
      }
      #settings-toggle::after {
        content: " ▾";
      }
      #settings-toggle[aria-expanded="true"]::after {
        content: " ▴";
      }
      #panel {
        width: 340px;
        max-width: 100%;
        max-height: calc(100dvh - 72px);
        overflow: auto;
        overscroll-behavior: contain;
        margin-top: 8px;
        background: #17172cf5;
        padding: 12px;
        border: 1px solid #5c5c96;
        border-radius: 8px;
      }
      #panel details + details {
        border-top: 1px solid #41405e;
        margin-top: 10px;
        padding-top: 10px;
      }
      #panel summary {
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        padding: 4px 0;
      }
      #panel details > :not(summary) {
        margin-top: 8px;
      }
      #panel label {
        min-width: 0;
      }
      #panel output {
        min-width: 3ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #file::file-selector-button {
        font: inherit;
        color: inherit;
        background: #29294a;
        border: 1px solid #8f86d9;
        border-radius: 4px;
        padding: 6px;
      }
      #status-indicator[data-kind="warning"] {
        color: #ffd18a;
      }
      #status-indicator[data-kind="error"] {
        color: #ffaaaa;
      }
      @media (max-width: 480px) {
        #minimap {
          max-width: 100px;
          max-height: 100px;
        }
        #panel {
          max-height: calc(100dvh - 116px);
        }
        #panel button,
        #panel select,
        #panel summary {
          min-height: 36px;
        }
      }
      button,
      select,
      input {
        font: inherit;
        color: inherit;
        accent-color: #c4b5fd;
      }
      button,
      select {
        background: #29294a;
        border: 1px solid #8f86d9;
        border-radius: 4px;
        padding: 4px 7px;
      }
      button:focus-visible,
      select:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid #c4b5fd;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input[type="range"] {
        width: 92px;
      }
      .lod-row {
        flex: 0 0 100%;
        width: 100%;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .lod-row input[type="range"] {
        flex: 1;
        width: auto;
        min-width: 0;
      }
      .hint {
        flex-basis: 100%;
        margin: 0;
        color: #aaa;
        font-size: 12px;
      }
      #status {
        flex-basis: 100%;
        margin: 0;
        color: #ddd;
        font-size: 12px;
      }
      details {
        flex-basis: 100%;
        font-size: 12px;
      }
      pre {
        white-space: pre-wrap;
        margin: 6px 0 0;
      }
      #file {
        max-width: 100%;
      }
      #minimap {
        position: absolute;
        right: 12px;
        bottom: 12px;
        width: 160px;
        height: 160px;
        border: 1px solid #5c5c96;
        border-radius: 8px;
        background: #12122ce8;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas
      id="globe"
      tabindex="0"
      aria-label="Interactive globe. Drag to rotate and pinch or scroll to zoom. Hold arrow keys to thrust, D to fly in, C to fly out, Space to brake and R to reset."
    ></canvas>
    <canvas
      id="minimap"
      width="160"
      height="160"
      aria-label="Globe culling minimap"
    ></canvas>
    <div id="controls">
      <div id="toolbar" role="group" aria-label="Globe viewer actions">
        <button
          id="settings-toggle"
          aria-expanded="false"
          aria-controls="panel"
        >
          ⚙ Settings
        </button>
        <button id="reset" title="Reset view">Reset view</button>
        <button id="minimap-toggle" aria-controls="minimap" aria-pressed="true">
          Minimap
        </button>
        <button
          id="status-indicator"
          aria-label="View rendering status"
          hidden
        ></button>
      </div>
      <section id="panel" aria-label="Globe settings" hidden>
        <details id="rendering" open>
          <summary>Rendering</summary>
        <label
          >Geometry
          <select id="mode">
            <option value="quadstream">Quadstream</option>
            <option value="original">Original</option>
          </select></label
        >
        <div id="lod-row" class="lod-row">
          <label for="level">LOD</label>
          <input
            id="level"
            type="range"
            min="0"
            max="19"
            step="0.1"
            value="4"
          /><output id="level-value">4</output>
        </div>
        <label><input id="show-quadtree" type="checkbox" /> Show quadtree</label>
        </details>
        <details id="data-source">
          <summary>Data source</summary>
          <label>Atlas
            <select id="atlas">
              <option value="110m">110m</option>
              <option value="50m" selected>50m</option>
              <option value="fixture">Test fixture</option>
            </select>
          </label>
          <label for="file">Local file</label>
          <input id="file" type="file" accept=".json,.geojson,.topojson" />
        </details>
        <details id="navigation">
          <summary>Navigation</summary>
          <label
            ><input id="smooth" type="checkbox" checked /> Smooth
            navigation</label
          >
          <div class="lod-row">
            <label for="nav-response">Response (ms)</label>
            <input
              id="nav-response"
              type="range"
              min="50"
              max="1500"
              step="10"
              value="300"
            /><output id="nav-response-value">300</output>
          </div>
          <div class="lod-row">
            <label for="nav-damping">Damping</label>
            <input
              id="nav-damping"
              type="range"
              min="0.1"
              max="2"
              step="0.05"
              value="1"
            /><output id="nav-damping-value">1</output>
          </div>
          <div class="lod-row">
            <label for="nav-zoom">Zoom speed</label>
            <input
              id="nav-zoom"
              type="range"
              min="0.25"
              max="3"
              step="0.05"
              value="1"
            /><output id="nav-zoom-value">1</output>
          </div>
          <div class="lod-row">
            <label for="nav-fly-pan">Fly pan (px/s)</label>
            <input
              id="nav-fly-pan"
              type="range"
              min="50"
              max="2000"
              step="10"
              value="600"
            /><output id="nav-fly-pan-value">600</output>
          </div>
          <div class="lod-row">
            <label for="nav-fly-zoom">Fly zoom (oct/s)</label>
            <input
              id="nav-fly-zoom"
              type="range"
              min="0.1"
              max="4"
              step="0.1"
              value="1"
            /><output id="nav-fly-zoom-value">1</output>
          </div>
          <div class="lod-row">
            <label for="nav-drag">Drag (1/s)</label>
            <input
              id="nav-drag"
              type="range"
              min="0.5"
              max="15"
              step="0.1"
              value="5"
            /><output id="nav-drag-value">5</output>
          </div>
          <p class="hint">
            Fly: arrows thrust, D in, C out, Space brake, R reset
          </p>
        </details>
        <details id="diagnostics-section">
          <summary>Diagnostics</summary>
          <p id="status" role="status" aria-live="polite">Loading geometry…</p>
          <button id="retry" hidden>Retry</button>
          <pre id="diagnostics"></pre>
        </details>
      </section>
    </div>
    <script type="module" src="./controls.mjs"></script>
    <script src="../../node_modules/d3/dist/d3.min.js"></script>
    <script src="../../node_modules/topojson-client/dist/topojson-client.min.js"></script>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
